# ── Gradle cache fix ──────────────────────────────────────────────────────────
# Redireciona o cache para um caminho SEM espaços.
# Necessário quando o usuário Windows tem espaço no nome da pasta home
# (ex: "C:\Users\Windows 10\") — o Gradle 8+ falha ao ler metadata nesses caminhos.
#
# INSTRUÇÕES:
#   1. Crie a pasta C:\gradle-cache manualmente (ou qualquer caminho sem espaços)
#   2. Cole este arquivo em: <raiz-do-projeto>\gradle.properties
#   3. Em File > Settings > Build > Gradle: marque "Use Gradle from: wrapper"
#   4. Execute: File > Invalidate Caches > Invalidate and Restart
#
org.gradle.user.home=C:/gradle-cache

# Performance
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Android
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
