name: SpendGuard — Agentes de Teste

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AVD
        run: |
          echo "y" | sdkmanager "system-images;android-34;google_apis;x86_64"
          avdmanager create avd -n test_avd -k "system-images;android-34;google_apis;x86_64" --force
          $ANDROID_SDK_ROOT/emulator/emulator -avd test_avd -no-audio -no-window -no-snapshot &
          adb wait-for-device
          sleep 30

      - name: Setup Node + Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium
        run: appium &
        env:
          APPIUM_HOME: /tmp/appium

      - name: Install Python deps
        run: pip install -r spendguard_agents/requirements.txt

      - name: Install APK
        run: adb install ${{ secrets.APK_PATH }}

      - name: Run smoke tests
        run: python spendguard_agents/main.py smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANDROID_DEVICE_NAME: emulator-5554
          ANDROID_APP_PACKAGE: com.joaolucas.spendguard
          ANDROID_APP_ACTIVITY: com.joaolucas.spendguard.MainActivity

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: spendguard_agents/reports/

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readdirSync('spendguard_agents/reports/').filter(f => f.startsWith('report_'));
            if (files.length === 0) return;
            const report = JSON.parse(fs.readFileSync(`spendguard_agents/reports/${files[files.length-1]}`));
            const icon = report.pass_rate >= 0.9 ? '✅' : report.pass_rate >= 0.7 ? '⚠️' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${icon} SpendGuard Test Results\n\n**Taxa de aprovação:** ${(report.pass_rate * 100).toFixed(1)}% (${report.passed}/${report.total})\n**Críticos:** ${report.critical} | **Warnings:** ${report.warnings}`
            });
